[project]
name = "social-media-autopilot"
version = "0.1.0"
description = "Academic MVP for an Instagram social media autopilot agent."
requires-python = ">=3.11"
dependencies = [
    "atproto>=0.0.65",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "openai>=2.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-telegram-bot>=21.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
